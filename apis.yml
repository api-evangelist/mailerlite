aid: mailerlite
url: https://raw.githubusercontent.com/api-evangelist/mailerlite/refs/heads/main/apis.yml
name: MailerLite
kind: company
description: >-
  MailerLite is an email marketing and automation platform used by creators, e-commerce
  sellers and small businesses to build lists, send campaigns and run behavioural
  automations. The current REST API at connect.mailerlite.com exposes subscribers,
  groups, segments, custom fields, campaigns, automations, forms, webhooks, batching,
  and a full e-commerce surface (shops, products, categories, customers, orders, carts)
  that drives abandoned-cart and post-purchase automations. Authentication is a bearer
  API key minted in the dashboard; responses are cursor-paginated and the API version
  can be pinned with an X-Version date header. Alongside the REST API, MailerLite ships
  six official SDKs, a first-party Go CLI with an interactive TUI, a published Agent
  Skill, and a hosted OAuth-protected MCP server at mcp.mailerlite.com exposing roughly
  76 tools to AI assistants. A legacy Classic API v2 still serves older accounts.
