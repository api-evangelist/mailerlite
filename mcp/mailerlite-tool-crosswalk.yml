generated: '2026-08-13'
method: derived
source: >-
  mcp/mailerlite-mcp.yml (76 documented MCP tools) bound against the 21
  operationIds present in openapi/*.yml, with the wider REST surface read from
  https://developers.mailerlite.com/api/* and /ecommerce/*.
notes: >-
  MailerLite's REST and MCP surfaces are NOT the same product. The MCP server
  exposes 76 tools; the OpenAPI in this repo carries 21 operations, and even the
  full documented REST reference (~70 endpoints) does not cover the automation
  builder, the template installers, or the AI content generators that MCP
  exposes. Confidence is capped at `medium` for every row because the live
  tools/list is OAuth-gated (HTTP 401) — mappings below are by name and
  documented semantics, not by observed inputSchema. Where a tool binds to an
  endpoint that is documented but NOT yet captured in openapi/, the row records
  the documented HTTP method+path in `rest_documented` and leaves `rest` empty
  rather than inventing an operationId.

surfaces:
