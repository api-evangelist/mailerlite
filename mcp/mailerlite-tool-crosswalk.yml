      - openapi/mailerlite-groups-api-openapi.yml
      - openapi/mailerlite-segments-api-openapi.yml
      - openapi/mailerlite-fields-api-openapi.yml
      - openapi/mailerlite-campaigns-api-openapi.yml
      - openapi/mailerlite-automations-api-openapi.yml
      - openapi/mailerlite-forms-api-openapi.yml
      - openapi/mailerlite-webhooks-api-openapi.yml
    base: https://connect.mailerlite.com
    operations: 21
    gated: false
    note: >-
      Coverage gap: the e-commerce API (shops, products, categories, customers,
      orders, carts, cart items, import), the batch endpoint, timezones and
      campaign-languages are documented by MailerLite but are not yet captured
      as OpenAPI in this repo.
  graphql:
    endpoint: null
    note: MailerLite publishes no GraphQL surface.
  mcp:
    url: https://mcp.mailerlite.com/mcp
    transport: streamable-http
    gated: true
    gate: oauth
    gate_evidence: "POST tools/list -> 401 invalid_token (2026-08-13)"
    tools: 76

