generated: '2026-08-13'
method: searched
status: published
source: https://developers.mailerlite.com/mcp
notes: >-
  MailerLite ships a FIRST-PARTY REMOTE MCP server at https://mcp.mailerlite.com/mcp,
  documented at https://developers.mailerlite.com/mcp and listed in the docs
  llms.txt. It is streamable HTTP, OAuth-protected, and reachable by an agent
  today with no local install. This supersedes the previous apis.yml MCPServer
  pointer, which pointed at github.com/mailerlite/canny-mcp-server — that repo
  is a server for Canny.io (MailerLite's feedback vendor), not for the
  MailerLite API, and was a mis-attribution.
  The provider labels the server "beta".

deployment:
  mode: remote
  endpoint: https://mcp.mailerlite.com/mcp
  transport: streamable-http
  auth: oauth
  verified: probed
  evidence:
    - probe: POST https://mcp.mailerlite.com/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}
      date: '2026-08-13'
      http_status: 401
      www_authenticate: >-
        Bearer realm="OAuth",
        resource_metadata="https://mcp.mailerlite.com/.well-known/oauth-protected-resource/mcp",
        error="invalid_token", error_description="Missing or invalid access token"
      body: '{"error":"invalid_token","error_description":"Missing or invalid access token"}'
      interpretation: >-
        The endpoint is live and speaks MCP over HTTP, but tools/list requires an
        OAuth access token. The tool list below therefore comes from the
        provider's own published documentation (names + descriptions), NOT from
        a live tools/list response — input schemas require authenticated
        introspection and are not recorded here.
    - probe: GET https://mcp.mailerlite.com/.well-known/oauth-protected-resource/mcp
      date: '2026-08-13'
      http_status: 200
    - probe: GET https://mcp.mailerlite.com/.well-known/oauth-authorization-server
      date: '2026-08-13'
      http_status: 200

server:
  name: mailerlite
  vendor: MailerLite
  url: https://mcp.mailerlite.com/mcp
  transport: http
  maturity: beta
  docs: https://developers.mailerlite.com/mcp
  examples: https://developers.mailerlite.com/mcp/examples
  feedback: mcp@mailerlite.com

authorization:
  model: oauth2
  protected_resource_metadata: https://mcp.mailerlite.com/.well-known/oauth-protected-resource/mcp
  authorization_server_metadata: https://mcp.mailerlite.com/.well-known/oauth-authorization-server
  issuer: https://mcp.mailerlite.com
  authorization_endpoint: https://mcp.mailerlite.com/authorize
  token_endpoint: https://mcp.mailerlite.com/token
  registration_endpoint: https://mcp.mailerlite.com/register
  revocation_endpoint: https://mcp.mailerlite.com/token
  grant_types: [authorization_code, refresh_token]
  code_challenge_methods: [plain, S256]
  token_endpoint_auth_methods: [client_secret_basic, client_secret_post, none]
  bearer_methods_supported: [header]
  dynamic_client_registration: true
  scopes_supported: null
  note: >-
    The authorization-server metadata declares no `scopes_supported`, so the
    server exposes no scope surface to record — see the absence of scopes/ in
    this repo. Dynamic Client Registration (RFC 7591) is open, which is what
    lets Claude, ChatGPT, Cursor and VS Code connect without a pre-registered
    client id.

clients_documented:
  - {client: Claude Desktop/Web, method: Settings > Connectors > Add Custom Connector}
  - {client: Claude Code, method: "claude mcp add --transport http mailerlite https://mcp.mailerlite.com/mcp"}
  - {client: Gemini CLI, method: "httpUrl entry in ~/.gemini/settings.json"}
  - {client: VS Code, method: one-click vscode:mcp/install deeplink}
  - {client: Cursor, method: cursor:// deeplink}
  - {client: ChatGPT, method: "Settings > Connectors > Create (developer mode, OAuth); Pro/Plus beta"}

