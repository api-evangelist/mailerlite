design_notes:
  - >-
    The e-commerce surface is collapsed into eight `manage_ecommerce_*` tools
    that take an `action` parameter (list/get/create/update/delete/import)
    rather than one tool per operation — a deliberate tool-count reduction the
    provider documents explicitly.
  - >-
    `search` and `fetch` are the OpenAI-connector convention pair, which is
    consistent with the documented ChatGPT connector support.
  - >-
    Several tools have NO REST equivalent — the conversational automation
    builders, the template installers and the AI content generators are
    MCP-only capability. See mcp/mailerlite-tool-crosswalk.yml.

