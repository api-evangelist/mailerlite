    name: mailerlite
    url: https://pypi.org/project/mailerlite/
    repository: https://github.com/mailerlite/mailerlite-python
    install: pip install mailerlite
    official: true
    version: 0.2.0
    published: '2026-07-06'
    note: >-
      PyPI 0.2.0 upload timestamp matches the mailerlite/mailerlite-python
      GitHub release v0.2.0, confirming the PyPI name maps to the official repo.

  - language: go
    registry: go
    name: github.com/mailerlite/mailerlite-go
    url: https://pkg.go.dev/github.com/mailerlite/mailerlite-go
    repository: https://github.com/mailerlite/mailerlite-go
    install: go get github.com/mailerlite/mailerlite-go
    official: true
    version: v1.2.0
    published: '2026-03-20'
    note: Read from proxy.golang.org/@latest.

  - language: ruby
    registry: rubygems
    name: mailerlite-ruby
    url: https://rubygems.org/gems/mailerlite-ruby
    repository: https://github.com/mailerlite/mailerlite-ruby
    install: gem install mailerlite-ruby
    official: true
    version: 2.0.0
    published: '2024-12-11'
    note: >-
      The unhyphenated `mailerlite` gem (1.17.0, 2026-02-26) is a THIRD-PARTY
      gem — its source_code_uri is github.com/jpalumickas/mailerlite-ruby, not
      the MailerLite org. Only `mailerlite-ruby` is first party.

  - language: rust
    registry: crates.io
    name: mailerlite-rs
    url: https://crates.io/crates/mailerlite-rs
    repository: https://github.com/mailerlite/mailerlite-rust
    install: cargo add mailerlite-rs
    official: true
    version: 1.0.0
    published: '2023-12-21'
    note: >-
      Listed as an official SDK on the Getting started page but has not shipped
      a release since December 2023.

  - language: java
    registry: maven
    name: com.mailerlite:mailerlite-java
    url: https://central.sonatype.com/artifact/com.mailerlite/mailerlite-java
    repository: https://github.com/mailerlite/mailerlite-java
    install: "implementation 'com.mailerlite:mailerlite-java:0.0.2'"
