generated: '2026-08-13'
method: searched
source: >-
  https://developers.mailerlite.com/getting-started (official SDK list),
  https://developers.mailerlite.com/cli, https://github.com/mailerlite, and the
  npm / Packagist / PyPI / Go module proxy / RubyGems / crates.io / Maven Central
  registry metadata endpoints (queried 2026-08-13).
notes: >-
  MailerLite names six official SDKs on its Getting started page (PHP, Go,
  Node.js, Python, Ruby, Rust) and ships a first-party CLI written in Go. Every
  `version` / `published` pair below was read from the registry metadata
  endpoint on 2026-08-13, not from a README. The currency spread is the finding:
  the Node.js SDK shipped eight days before this pass while the Rust SDK and the
  Java library have not shipped since 2023, and the Ruby SDK has not shipped
  since 2024 — three of the eight official libraries predate the e-commerce and
  batching surface MailerLite documents today.

packages:
  - language: javascript
    registry: npm
    name: "@mailerlite/mailerlite-nodejs"
    url: https://www.npmjs.com/package/@mailerlite/mailerlite-nodejs
    repository: https://github.com/mailerlite/mailerlite-nodejs
    install: npm install @mailerlite/mailerlite-nodejs
    official: true
    version: 1.7.0
    published: '2026-08-05'
    note: Most current of the official SDKs; registry.npmjs.org dist-tags.latest.

  - language: php
    registry: packagist
    name: mailerlite/mailerlite-php
    url: https://packagist.org/packages/mailerlite/mailerlite-php
    repository: https://github.com/mailerlite/mailerlite-php
    install: composer require mailerlite/mailerlite-php
