  - language: go
    registry: go
    name: github.com/mailerlite/mailerlite-cli
    url: https://github.com/mailerlite/mailerlite-cli
    repository: https://github.com/mailerlite/mailerlite-cli
    install: go install github.com/mailerlite/mailerlite-cli@latest
    official: true
    kind: cli
    version: v1.0.2
    published: '2026-02-19'
    note: >-
      The `mailerlite` CLI binary. Also distributed as a Homebrew cask
