openapi: 3.2.0
info:
  title: MailerLite Webhook API
  version: '2.0'
servers:
- url: http://api.mailerlite.com/api/v2
- url: https://api.mailerlite.com/api/v2
tags:
- name: Webhook
paths:
  /webhooks:
    get:
      tags:
      - Webhook
      summary: Get the list of webhooks
      operationId: createWebhook
      parameters:
      - name: limit
        in: query
        description: max records to return
        required: false
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        description: number of items to skip
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: successful operation
      security:
      - api_key: []
    post:
      tags:
      - Webhook
      summary: Create a webhook
      operationId: postWebhooks
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid data provided
      security:
      - api_key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook'
        description: Created webhook object
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: createWebhook
  /webhooks/{webhookId}:
    get:
      tags:
      - Webhook
      summary: Info for a specific webhook
      operationId: showWebhookById
      parameters:
      - name: webhookId
        in: path
        description: The id of the webhook to retrieve
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '404':
          description: A webhook is not found
      security:
      - api_key: []
    put:
      tags:
      - Webhook
      summary: Update the specific webhook
      operationId: updateWebhook
      parameters:
      - name: webhookId
        in: path
        description: The id of the webhook to update
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid data provided
      security:
      - api_key: []
    delete:
      tags:
      - Webhook
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
      - name: webhookId
        in: path
        description: The id of the webhook to delete
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful operation
        '404':
          description: Webhook not found
      security:
      - api_key: []
  /webhooks/count:
    get:
      tags:
      - Webhook
      summary: Get the count of webhooks
      operationId: getCountOfWebhooks
      responses:
        '200':
          description: successful operation
      security:
      - api_key: []
components:
  schemas:
    Webhook:
      properties:
        event:
          description: Event
          format: string
        url:
          description: URL for a webhook
          format: string
  securitySchemes:
    api_key:
      type: apiKey
      name: x-mailerlite-apikey
      in: header
externalDocs:
  description: Find out more about Mailerlite
  url: http://developers.mailerlite.com
