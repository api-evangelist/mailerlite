      - links.next
      - links.prev
      - meta.next_cursor
      - meta.prev_cursor
    x-batching:
      endpoint: POST /api/batch
      max_requests: 50
      note: Webhooks are not supported in batch requests.
- target: $.servers
  update:
  - url: https://connect.mailerlite.com
    description: Production
- target: $.paths['/api/campaigns'].post
  update:
